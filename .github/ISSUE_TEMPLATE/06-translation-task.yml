name: "06. Stand-Off Translation Revision or Addition Task"
description: "Revise or add stand-off translations under translations/{lang}/ mapped via target_urn."
title: "[TRANSLATION:STANDOFF] "
labels: ["type:translation", "status:ready-for-revision"]
body:
  - type: input
    id: language_code
    attributes:
      label: Target Language Code / رمز اللغة المستهدفة
      description: "e.g. en (English), fr (French), ur (Urdu)"
      placeholder: "en"
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Corpus Domain / المجال العلمي
      options:
        - "quran (القرآن الكريم)"
        - "tafseer (التفاسير)"
        - "hadith (الحديث الشريف)"
        - "adhkar (الأذكار المأثورة)"
        - "matns (المتون العلمية)"
    validations:
      required: true

  - type: input
    id: source_urn
    attributes:
      label: Translation Source URN / معرّف مصدر الترجمة
      description: "Registered URN of the published, accredited translation."
    validations:
      required: true

  - type: textarea
    id: target_path_globs
    attributes:
      label: Target Path Globs / مسارات ملفات الترجمة
      description: "e.g. translations/en/hadith/nawawi40.json, translations/en/quran/*.json. Required for PR Gatekeeper Gate B."
    validations:
      required: true

  - type: textarea
    id: scope_description
    attributes:
      label: Translation Scope / نطاق العمل
      description: "Specify range of verses, hadiths, or matn segments translated."
    validations:
      required: true

  - type: checkboxes
    id: translation_checklist
    attributes:
      label: Stand-Off Translation Checklist / ضوابط الترجمة المستقلة
      options:
        - label: "Stand-off architecture: Arabic source files remain 100% untouched."
          required: true
        - label: "Every translation item maps 1-to-1 via valid, existing target_urn."
          required: true
        - label: "Translation is verified against an accredited, reputable scholarly translation edition."
          required: true
