name: "01. Verified Text or Reference Discrepancy (Requires Source Proof)"
description: "Report a rare textual, tashkeel, or reference discrepancy backed by proof from an accredited source. Unsubstantiated issues are closed immediately."
title: "[DISCREPANCY:VERIFIED] "
labels: ["type:discrepancy-report", "status:awaiting-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ Strict Verification Requirement / تنبيه منهجي صارم
        **English**: Every discrepancy report must be backed by verifiable proof from an accredited critical printed edition or recognized scholarly portal registered in `SOURCES_MANIFEST.json`. Unsubstantiated or vague issues are closed immediately.
        
        **العربية**: يجب أن يكون كل بلاغ عن تصويب أو خطأ مدعوماً بإحالة دقيقة إلى طبعة محققة معتمدة أو بوابة علمية رسمية مسجلة في سجل المصادر. البلاغات العشوائية أو غير الموثقة تُغلق فوراً دون مراجعة.

  - type: dropdown
    id: domain
    attributes:
      label: Corpus Domain / المجال العلمي
      options:
        - "quran (القرآن الكريم)"
        - "tafseer (التفاسير)"
        - "hadith (الحديث الشريف)"
        - "adhkar (الأذكار المأثورة)"
        - "matns (المتون العلمية)"
        - "shuruh (شروح المتون)"
        - "lexicons (المعاجم وغريب الألفاظ)"
        - "entities (التراجم والسير)"
        - "translations (الترجمات)"
    validations:
      required: true

  - type: input
    id: source_name
    attributes:
      label: Source Work / الكتاب أو المصنف
      description: "e.g. Sahih al-Bukhari, Tafseer al-Tabari, Matn al-Jazariyyah, Hisn al-Muslim"
    validations:
      required: true

  - type: input
    id: exact_reference
    attributes:
      label: Exact Text Location / موضع النص بدقة
      description: "e.g. Surah 2:255, Hadith #1, Bab al-Niyyah, Matn Bayquniyyah Line 14"
    validations:
      required: true

  - type: textarea
    id: current_text
    attributes:
      label: Current Text in Corpus / النص الحالي كما يظهر في مشكاة
      render: text
    validations:
      required: true

  - type: textarea
    id: suggested_correction
    attributes:
      label: Suggested Correction / التصويب المقترح المضبوط بالشكل
      render: text
    validations:
      required: true

  - type: input
    id: accredited_source_reference
    attributes:
      label: Accredited Edition or Official Portal Reference / الطبعة المحققة المعتمدة أو البوابة الرسمية
      description: "Provide publisher, investigator, publication year, volume, and page number, or direct URL to an accredited scholarly portal."
    validations:
      required: true

  - type: textarea
    id: verification_proof
    attributes:
      label: Verification Proof & Citation / دليل التوثيق والتحقيق
      description: "Quote the critical apparatus, provide page scan link, or detailed scholarly reference verifying the suggested correction."
    validations:
      required: true

  - type: checkboxes
    id: certification
    attributes:
      label: Scholarly Certification / الإقرار المنهجي
      options:
        - label: "I certify that I have verified this discrepancy against an accredited critical printed edition or official institutional portal, and that unsubstantiated reports are closed immediately."
          required: true
