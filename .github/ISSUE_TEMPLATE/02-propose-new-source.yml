name: "02. Propose a New Scholarly Source (Formal Qualification)"
description: "Propose a critical printed edition for curriculum qualification. Casual book suggestions are rejected immediately."
title: "[SOURCE:QUALIFICATION] "
labels: ["type:source-qualification", "status:needs-maintainer-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📚 Scholarly Source Qualification / مقترح تأهيل مصدر مطبوع
        
        > ⚠️ **CURATED CURRICULUM POLICY / تنبيه حول السياسة المنهجية**:
        > Mishkaah does **NOT** accept casual book additions or arbitrary title requests.
        > Works are scheduled strictly according to our planned scholarly curriculum.
        > This form is strictly for qualifying an authoritative critical printed edition with complete documentation of editor (*Muhaqqiq*), publishing house, manuscript witnesses, and public domain/open licensing.
        > **Unsubstantiated or casual book suggestions will be rejected and closed immediately.**
        >
        > مشروع مشكاة ليس مستودعاً مفتوحاً لاقتراح الكتب كيفما اتفق؛ بل تُدرج المصنفات وفق خطة منهجية معتمدة. هذا النموذج مخصص حصراً لتأهيل الطبعات المحققة الموثوقة مع بيان نسخها الخطية وجهود محققها وحقوق نشرها. أي اقتراح عشوائي سيُغلق فوراً.

  - type: input
    id: source_name_ar
    attributes:
      label: "Book / Work Title in Arabic (عنوان الكتاب بالعربية)"
      placeholder: "e.g. صحيح البخاري، سنن أبي داود، التبيان في آداب حملة القرآن"
    validations:
      required: true

  - type: input
    id: source_name_en
    attributes:
      label: "Book / Work Title in English / Transliteration (عنوان الكتاب بالإنجليزية)"
      placeholder: "e.g. Sahih al-Bukhari, Al-Tibyan fi Adab Hamalat al-Quran"
    validations:
      required: true

  - type: input
    id: author_details
    attributes:
      label: "Author / Scholar & Death Year (اسم المصنف وسنة الوفاة)"
      placeholder: "e.g. Al-Imam Yahya ibn Sharaf al-Nawawi (d. 676 AH)"
    validations:
      required: true

  - type: dropdown
    id: corpus_domain
    attributes:
      label: "Applicable Corpus Domain (المجال)"
      options:
        - QURAN
        - HADITH
        - TAFSEER
        - ASBAB
        - MATN
        - SHARH
        - LEXICON
        - ENTITY
        - TRANSLATION
    validations:
      required: true

  - type: textarea
    id: publication_details
    attributes:
      label: "Critical Printed Edition Details (بيانات الطبعة المعتمدة والمحقق)"
      description: "Editor(s) (Muhaqqiq), Publisher (Dar), City, Publication Year, Number of Volumes, and ISBN."
      placeholder: "Edited by Muhammad Zuhayr ibn Nasir al-Nasir, Published by Dar Tuq al-Najah (Beirut), 1422 AH / 2001 CE, 9 Volumes."
    validations:
      required: true

  - type: textarea
    id: authentication_and_manuscripts
    attributes:
      label: "Manuscript Witnesses & Academic Pedigree (النسخ الخطية وتوثيق الطبعة)"
      description: "Describe historical manuscript witnesses, critical apparatus, or scholarly consensus verifying this edition."
      placeholder: "Based on the Sultaniyyah / Yuniniyyah recension compared against authenticated early manuscript branches..."
    validations:
      required: true

  - type: dropdown
    id: copyright_status
    attributes:
      label: "Copyright & Licensing Status (حقوق النشر والملكية)"
      description: "Confirm legal and ethical status for open distribution."
      options:
        - "Public Domain (Classical Arabic Text deceased > 70 years, non-proprietary typesetting)"
        - "Creative Commons / Open Access licensed by publisher/institution"
        - "Direct Academic Permission Granted"
    validations:
      required: true

  - type: textarea
    id: sample_text_or_scan
    attributes:
      label: "Link to Digitized Scan or Archive (رابط النسخة المصورة أو الأرشيف)"
      description: "Provide a link to digital archive / PDF scan (e.g. Archive.org, Waqfeya)."
      placeholder: "Links to PDF archive or volume scan..."
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: "Curriculum & Qualification Confirmation (إقرار المنهجية والتأهيل)"
      options:
        - label: "I confirm that this is a fully documented critical printed edition with complete publisher, editor, and manuscript information, and not an arbitrary book request."
          required: true
