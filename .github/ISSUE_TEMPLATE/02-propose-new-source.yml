name: "02. Propose a New Scholarly Source"
description: "Propose and qualify an authentic printed critical edition, manuscript, or classical work for acquisition into Mishkaah."
title: "[SOURCE:PROPOSAL] Acquire: "
labels: ["type:source-qualification", "status:needs-maintainer-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📚 Scholarly Source Qualification Protocol / مقترح تأهيل مصدر مطبوع
        Before any new book, manuscript, or classical text is ingested into Mishkaah, its scholarly pedigree, manuscript witnesses, printed edition editor (*Muhaqqiq*), and licensing status must be reviewed and registered in `corpus/SOURCES_MANIFEST.json`.
        **Issue Title Format**: `[SOURCE:PROPOSAL] Acquire: <Work Title in Arabic or English>`

  - type: input
    id: source_name_ar
    attributes:
      label: "Book / Work Title in Arabic (عنوان الكتاب بالعربية)"
      placeholder: "e.g. صحيح البخاري، سنن أبي داود، التبيان في آداب حملة القرآن"
    validations:
      required: true

  - type: input
    id: source_name_en
    attributes:
      label: "Book / Work Title in English / Transliteration (عنوان الكتاب بالإنجليزية)"
      placeholder: "e.g. Sahih al-Bukhari, Al-Tibyan fi Adab Hamalat al-Quran"
    validations:
      required: true

  - type: input
    id: author_details
    attributes:
      label: "Author / Scholar & Death Year (اسم المصنف وسنة الوفاة)"
      placeholder: "e.g. Al-Imam Yahya ibn Sharaf al-Nawawi (d. 676 AH)"
    validations:
      required: true

  - type: dropdown
    id: corpus_domain
    attributes:
      label: "Applicable Corpus Domain (المجال)"
      options:
        - QURAN
        - HADITH
        - TAFSEER
        - ASBAB
        - MATN
        - SHARH
        - LEXICON
        - ENTITY
        - TRANSLATION
    validations:
      required: true

  - type: textarea
    id: publication_details
    attributes:
      label: "Printed Critical Edition Details (بيانات الطبعة المعتمدة والمحقق)"
      description: "Editor(s) (Muhaqqiq), Publisher (Dar), City, Publication Year, Number of Volumes, and ISBN."
      placeholder: "Edited by Muhammad Zuhayr ibn Nasir al-Nasir, Published by Dar Tuq al-Najah (Beirut), 1422 AH / 2001 CE, 9 Volumes."
    validations:
      required: true

  - type: textarea
    id: authentication_and_manuscripts
    attributes:
      label: "Manuscript Witnesses & Scholarly Authentication (النسخ الخطية وتوثيق الطبعة)"
      description: "Describe historical manuscript witnesses, critical apparatus, or scholarly consensus verifying this edition."
      placeholder: "Based on the Sultaniyyah / Yuniniyyah recension compared against authenticated early manuscript branches..."
    validations:
      required: true

  - type: dropdown
    id: copyright_status
    attributes:
      label: "Copyright & Licensing Status (حقوق النشر والملكية)"
      description: "Confirm legal and ethical status for open distribution."
      options:
        - "Public Domain (Classical Arabic Text deceased > 70 years, non-proprietary typesetting)"
        - "Creative Commons / Open Access licensed by publisher/institution"
        - "Direct Academic Permission Granted"
    validations:
      required: true

  - type: textarea
    id: sample_text_or_scan
    attributes:
      label: "Sample Text or Link to Digitized Scan (عينة نصية أو رابط النسخة المصورة)"
      description: "Provide sample text lines or link to digital archive / PDF scan (e.g. Archive.org, Waqfeya)."
      placeholder: "Links to PDF archive or volume scan..."
    validations:
      required: false
