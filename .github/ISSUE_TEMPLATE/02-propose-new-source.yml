name: "02. Propose a New Scholarly Source (Formal Qualification)"
description: "Propose an accredited source (critical printed edition or official scholarly portal) for curriculum qualification. Unsubstantiated suggestions are rejected immediately."
title: "[SOURCE:QUALIFICATION] "
labels: ["type:source-qualification", "status:needs-maintainer-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📚 Scholarly Source Qualification / مقترح تأهيل مصدر علمي معتمد
        
        > ⚠️ **CURATED CURRICULUM POLICY / تنبيه حول السياسة المنهجية**:
        > Mishkaah does **NOT** accept casual book additions or arbitrary title requests.
        > Works are scheduled strictly according to our planned scholarly curriculum.
        > This form is strictly for qualifying an authoritative accredited source — either a recognized critical printed edition (with complete documentation of editor/Muhaqqiq, publisher, and manuscript witnesses) or an official scholarly portal/archive.
        > **Unsubstantiated or casual source suggestions will be rejected and closed immediately.**
        >
        > مشروع مشكاة ليس مستودعاً مفتوحاً لاقتراح الكتب كيفما اتفق؛ بل تُدرج المصنفات وفق خطة منهجية معتمدة ومدروسة. هذا النموذج مخصص حصراً لتأهيل المصادر العلمية المعتمدة — سواء كانت طبعات محققة موثوقة (مع بيان نسخها الخطية وجهود محققها ودار نشرها) أو بوابات ومجاميع علمية رقمية رسمية ومعتمدة. أي مقترح عشوائي أو غير موثق سيُغلق فوراً.

  - type: input
    id: source_name_ar
    attributes:
      label: "Book / Work Title in Arabic (عنوان الكتاب بالعربية)"
      placeholder: "e.g. صحيح البخاري، سنن أبي داود، التبيان في آداب حملة القرآن"
    validations:
      required: true

  - type: input
    id: source_name_en
    attributes:
      label: "Book / Work Title in English / Transliteration (عنوان الكتاب بالإنجليزية)"
      placeholder: "e.g. Sahih al-Bukhari, Al-Tibyan fi Adab Hamalat al-Quran"
    validations:
      required: true

  - type: input
    id: author_details
    attributes:
      label: "Author / Scholar & Death Year (اسم المصنف وسنة الوفاة)"
      placeholder: "e.g. Al-Imam Yahya ibn Sharaf al-Nawawi (d. 676 AH)"
    validations:
      required: true

  - type: dropdown
    id: corpus_domain
    attributes:
      label: "Applicable Corpus Domain (المجال)"
      options:
        - QURAN
        - HADITH
        - TAFSEER
        - ASBAB
        - MATN
        - SHARH
        - LEXICON
        - ENTITY
        - TRANSLATION
    validations:
      required: true

  - type: textarea
    id: publication_details
    attributes:
      label: "Accredited Source / Edition Details (بيانات المصدر المعتمد أو الطبعة والمحقق)"
      description: "For printed editions: Editor(s) (Muhaqqiq), Publisher (Dar), City, Publication Year, Volumes. For digital portals: Official institutional portal name, hosting scholarly body, and catalog/record identifier."
      placeholder: "e.g. Edited by Muhammad Zuhayr ibn Nasir al-Nasir, Dar Tuq al-Najah (Beirut), 1422 AH / 2001 CE, 9 Volumes. OR: Official portal of the King Fahd Complex for the Printing of the Holy Quran, Record #..."
    validations:
      required: true

  - type: textarea
    id: authentication_and_manuscripts
    attributes:
      label: "Scholarly Credibility & Documentation (توثيق المصدر واعتماده العلمي)"
      description: "Describe historical manuscript witnesses, critical apparatus, or official institutional accreditation verifying this source."
      placeholder: "Based on verified manuscript witnesses / approved by scholarly advisory committee..."
    validations:
      required: true

  - type: dropdown
    id: copyright_status
    attributes:
      label: "Copyright & Licensing Status (حقوق النشر والملكية)"
      description: "Confirm legal and ethical status for open distribution."
      options:
        - "Public Domain (Classical Arabic Text deceased > 70 years, non-proprietary typesetting)"
        - "Creative Commons / Open Access licensed by publisher/institution"
        - "Direct Academic Permission Granted"
    validations:
      required: true

  - type: textarea
    id: sample_text_or_scan
    attributes:
      label: "Link to Digitized Scan, Archive, or Official Portal (رابط النسخة المصورة أو الأرشيف أو البوابة الرسمية)"
      description: "Provide a verifiable link to digital archive, PDF scan, or official scholarly portal."
      placeholder: "Links to PDF archive, volume scan, or official portal record..."
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: "Curriculum & Qualification Confirmation (إقرار المنهجية والتأهيل)"
      options:
        - label: "I confirm that this is a fully documented accredited scholarly source (critical printed edition or official institutional portal) with verifiable pedigree, and not an arbitrary suggestion."
          required: true
