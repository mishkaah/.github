name: "01. Verified Textual or Reference Report (Requires Source Proof)"
description: "Submit a documented textual or reference discrepancy backed by citation to the approved printed edition. Unsubstantiated issues are closed immediately."
title: "[DISCREPANCY:VERIFIED] "
labels: ["type:public-feedback", "status:awaiting-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📖 Verified Textual or Reference Report / استدراك نصي أو توثيقي معتمد
        
        > ⚠️ **MANDATORY POLICY / تنبيه إلزامي**:
        > Before submitting this report, you **MUST** read our [Contribution & Verification Rules](https://github.com/mishkaah/.github/blob/main/docs/non-technical-contributing.md).
        > All texts in Mishkaah undergo rigorous multi-stage verification against approved printed editions.
        > **Any issue opened without exact citation, solid verifiable proof, and page references from the approved printed edition will be rejected and closed immediately.**
        >
        > يجب قراءة [ضوابط المساهمة والتدقيق العلمي](https://github.com/mishkaah/.github/blob/main/docs/non-technical-contributing.ar.md) قبل فتح هذا البلاغ. أي استدراك يُفتح دون إحالة دقيقة للطبعة المعتمدة ودليل موثق (الجزء والصفحة أو صورة واضحة) سيُرفض ويُغلق فوراً.

  - type: dropdown
    id: domain
    attributes:
      label: "Domain / Classical Science (المجال)"
      description: "Select the Islamic science or corpus category."
      options:
        - "Quran (القرآن الكريم)"
        - "Hadith & Sunnah (الحديث الشريف)"
        - "Tafseer & Quranic Sciences (التفسير وعلوم القرآن)"
        - "Mutun & Shuruh (المتون العلمية والشروح)"
        - "Adhkar & Supplications (الأذكار والأدعية)"
        - "Lexicons & Arabic Dictionaries (المعاجم اللغوية)"
        - "Entities & Historical Persons (الأعلام والكيانات)"
        - "English Translations (الترجمات الإنجليزية)"
    validations:
      required: true

  - type: input
    id: source_name
    attributes:
      label: "Book, Matn, or Source Title (اسم الكتاب أو المتن)"
      description: "The name of the work where the issue is found."
      placeholder: "e.g. Sahih al-Bukhari, Al-Muqaddimah al-Jazariyyah, Tafseer al-Tabari"
    validations:
      required: true

  - type: input
    id: exact_reference
    attributes:
      label: "Exact Reference / Location (الموضع بدقة)"
      description: "Surah and Ayah number, Hadith number, line number, or canonical URN."
      placeholder: "e.g. Surah Al-Baqarah 2:255, Hadith #42, Line 18"
    validations:
      required: true

  - type: textarea
    id: current_text
    attributes:
      label: "Current Text in Mishkaah (النص الحالي كما يظهر)"
      description: "Paste the text containing the discrepancy."
      placeholder: "Paste the current text here..."
    validations:
      required: true

  - type: textarea
    id: suggested_correction
    attributes:
      label: "Suggested Correction with Tashkeel (النص المصوب مع التشكيل)"
      description: "Provide the accurate reading with complete classical Arabic tashkeel."
      placeholder: "Write the corrected text with diacritics here..."
    validations:
      required: true

  - type: textarea
    id: printed_reference
    attributes:
      label: "Approved Printed Edition Citation (طبعة الكتاب المعتمدة والمحقق ورقم الصفحة)"
      description: "Mandatory: publisher, editor (Muhaqqiq), volume, and page number from the approved printed edition."
      placeholder: "e.g. Dar Tuq al-Najah edition, edited by M. Zuhayr al-Nasir, Vol. 1, p. 12"
    validations:
      required: true

  - type: textarea
    id: verification_proof
    attributes:
      label: "Verifiable Proof / Scan URL (دليل التحقيق أو رابط النسخة المصورة)"
      description: "Provide links to high-resolution manuscript/printed edition scans (e.g. Archive.org, Waqfeya)."
      placeholder: "Links to PDF archive or volume scan..."
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: "Verification Confirmation (إقرار التدقيق والمصدر)"
      options:
        - label: "I confirm that I have read the Contribution & Verification Rules and that this discrepancy is verified directly against an approved critical printed edition."
          required: true
